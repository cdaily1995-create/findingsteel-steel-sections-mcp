# FindingSteel MCP — reverse proxy blocks (append inside the 443 www server block)
# Endpoint: https://www.findingsteel.com/mcp
location = /mcp { return 301 /mcp/; }
location /mcp/ {
    proxy_pass http://127.0.0.1:3001/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # MCP Streamable HTTP needs streaming
    proxy_buffering off;
    proxy_cache off;
    # SSE for standalone stream transport
    add_header X-Accel-Buffering no;
}
